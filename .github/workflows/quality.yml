name: Portfolio quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build:page && git diff --exit-code -- src/index.html src/text.html
      - run: npm test
        env:
          GUESTBOOK_REDIS_TEST_PORT: 6379
      - run: npx playwright install --with-deps chromium
      - name: Audit visibility and target measurement
        run: npm run test:audit-browser
      - name: Start local static server
        run: python -m http.server 5174 --directory src > /tmp/portfolio-server.log 2>&1 &
      - name: Responsive and interaction regression
        run: npm run test:browser -- http://127.0.0.1:5174 test-results
      - name: Sound, navigation, enlarged text and motion
        run: npm run test:experience -- http://127.0.0.1:5174 test-results/experience
      - name: Progressive media, delayed images and graphics recovery
        run: npm run test:media -- http://127.0.0.1:5174 test-results/media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression
          path: test-results
          if-no-files-found: ignore
