# One live Ask request per run; uncached replies incur provider model usage.
# Failures remain failures; notifications depend on GitHub account settings.
name: Uptime check
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate live pages, API contracts and linked demos
        run: node scripts/health/check-live.mjs --production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uptime-results
          path: test-results/health
          if-no-files-found: warn
